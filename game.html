<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070d1b">
<title>Sudoku | Alislamiah AATB Games</title>
<link rel="icon" href="icon.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:radial-gradient(ellipse at top,#142c54,#070d1b 65%);
 color:#fff;font-family:Inter,Arial,sans-serif;
 min-height:100vh;
}
header{
 height:72px;padding:0 5%;display:flex;
 align-items:center;justify-content:space-between;
 border-bottom:1px solid #ffffff12;
}
.brand{display:flex;align-items:center;gap:11px}
.brand img{width:42px;height:42px;border-radius:12px;object-fit:cover}
.brand h2{font-size:17px}
.brand small{display:block;font-size:9px;color:#7789a8;margin-top:4px;letter-spacing:1px}
.back{
 color:#a9caff;text-decoration:none;border:1px solid #ffffff20;
 border-radius:10px;padding:9px 13px;font-size:12px;
}
main{max-width:620px;margin:auto;padding:25px 14px 45px}
.top{text-align:center;margin-bottom:20px}
.top h1{font-size:27px;font-weight:900}
.top p{font-size:11px;color:#8294b2;margin-top:7px}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:9px;margin-bottom:17px;
}
.stat{
 background:#111f37;border:1px solid #ffffff10;
 border-radius:12px;padding:12px 5px;text-align:center;
}
.stat small{font-size:9px;color:#8598b7;display:block;margin-bottom:7px}
.stat strong{font-size:17px;font-variant-numeric:tabular-nums}
.board-wrap{
 background:#101e35;border:1px solid #ffffff20;
 padding:8px;border-radius:15px;
 box-shadow:0 15px 45px #0005;
}
.board{
 display:grid;grid-template-columns:repeat(9,1fr);
 aspect-ratio:1;width:100%;border:2px solid #8db9f8;
 overflow:hidden;border-radius:4px;
}
.cell{
 min-width:0;aspect-ratio:1;border:1px solid #34435d;
 background:#101f37;color:#fff;
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(15px,4.4vw,23px);
 font-weight:600;cursor:pointer;position:relative;
 user-select:none;
}
.cell:nth-child(3n){border-right:2px solid #819fc6}
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #819fc6}
.cell.fixed{color:#d9e6ff;background:#192b48}
.cell.selected{background:#2862ad!important}
.cell.related{background:#192f4d}
.cell.same{background:#244c78}
.cell.error{color:#ff687c;background:#492536}
.cell.notes{
 font-size:clamp(6px,1.9vw,10px);
 display:grid;grid-template-columns:repeat(3,1fr);
 place-items:center;color:#81b8ff;
}
.cell .note{line-height:1}
.cell:focus{outline:none}
.controls{
 display:grid;grid-template-columns:repeat(9,1fr);
 gap:5px;margin-top:17px;
}
.num{
 aspect-ratio:1;border:1px solid #36547e;
 border-radius:9px;background:#172a48;color:#9fc5ff;
 font-size:clamp(15px,4vw,20px);font-weight:800;
 cursor:pointer;
}
.num:active,.action:active{transform:scale(.94)}
.num:disabled{opacity:.3;cursor:not-allowed}
.actions{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:8px;margin-top:13px;
}
.action{
 padding:12px 4px;border:1px solid #ffffff15;
 border-radius:10px;background:#14243d;
 color:#d6e5ff;font-size:10px;font-weight:700;
 cursor:pointer;
}
.action.active{background:#2457a0;border-color:#5799ff}
.bottom-actions{
 display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px;
}
.primary,.secondary{
 border:0;border-radius:11px;padding:14px;
 font-size:12px;font-weight:800;cursor:pointer;
}
.primary{background:#397cff;color:white}
.secondary{background:#1a2b46;color:#b8d3ff;border:1px solid #ffffff16}
.message{
 margin-top:13px;min-height:20px;text-align:center;
 font-size:11px;color:#91baff;
}
.overlay{
 position:fixed;inset:0;z-index:20;
 background:#030915df;display:none;
 align-items:center;justify-content:center;padding:20px;
}
.overlay.show{display:flex}
.modal{
 max-width:370px;width:100%;background:#13223b;
 border:1px solid #ffffff20;border-radius:20px;
 padding:28px;text-align:center;
}
.modal h2{font-size:25px;margin-bottom:12px}
.modal p{font-size:12px;color:#9aacc8;line-height:1.8}
.modal button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:10px;background:#397cff;color:white;font-weight:800}
.modal .second{background:#243956}
.difficulty{
 display:inline-block;margin-top:12px;padding:7px 12px;
 background:#203b61;border-radius:20px;color:#9fc6ff;
 font-size:10px;font-weight:800;
}
footer{text-align:center;color:#566985;font-size:9px;padding:15px}
@media(max-width:390px){
 main{padding-left:9px;padding-right:9px}
 .board-wrap{padding:5px}
 .cell{font-size:14px}
 .actions{gap:5px}
 .action{font-size:9px}
}
</style>
</head>

<body>

<header>
 <div class="brand">
  <img src="icon.png" alt="Sudoku">
  <div><h2>Sudoku</h2><small>ALISLAMIAH AATB GAMES</small></div>
 </div>
 <a href="index.html" class="back">← Home</a>
</header>

<main>
 <section class="top">
  <h1>Sudoku Challenge</h1>
  <p>Think smart. Stay focused. Solve the puzzle.</p>
  <div class="difficulty" id="difficulty">EASY</div>
 </section>

 <section class="stats">
  <div class="stat"><small>TIME</small><strong id="timer">00:00</strong></div>
  <div class="stat"><small>MISTAKES</small><strong id="mistakes">0 / 3</strong></div>
  <div class="stat"><small>HINTS</small><strong id="hints">3</strong></div>
 </section>

 <div class="board-wrap">
  <div class="board" id="board"></div>
 </div>

 <div class="controls" id="numbers"></div>

 <div class="actions">
  <button class="action" id="notesBtn">✎ Notes: OFF</button>
  <button class="action" id="eraseBtn">⌫ Erase</button>
  <button class="action" id="undoBtn">↶ Undo</button>
  <button class="action" id="hintBtn">✦ Hint</button>
 </div>

 <div class="bottom-actions">
  <button class="secondary" id="checkBtn">Check Puzzle</button>
  <button class="primary" id="newBtn">New Game ↻</button>
 </div>

 <div class="message" id="message">Select a cell and choose a number.</div>
</main>

<footer>Powered by Alislamiah AATB Games · © 2026</footer>

<div class="overlay" id="overlay">
 <div class="modal">
  <h2 id="modalTitle">Congratulations!</h2>
  <p id="modalText">You solved the puzzle.</p>
  <button id="modalNew">New Game</button>
  <button class="second" id="modalHome">Back to Home</button>
 </div>
</div>

<script>
// ====================================
// GAME STATE
// ====================================
const $=id=>document.getElementById(id);
const boardEl=$("board");
const numberEl=$("numbers");

let solution=[],puzzle=[],fixed=[];
let notes=Array.from({length:81},()=>new Set());
let selected=-1;
let mistakes=0,hints=3;
let elapsed=0,timerInterval=null;
let noteMode=false,gameOver=false;
let history=[];
let difficulty="easy";

const savedDifficulty=localStorage.getItem("sudoku_difficulty");
if(["easy","medium","hard"].includes(savedDifficulty)){
 difficulty=savedDifficulty;
}

$("difficulty").textContent=difficulty.toUpperCase();

// ====================================
// SUDOKU GENERATOR
// ====================================
function shuffle(a){
 let arr=[...a];
 for(let i=arr.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr;
}

function pattern(r,c){
 return (Math.floor(r%9/3)*3+r%3+c)%9;
}

function generateSolution(){
 const bands=shuffle([0,1,2]);
 const rows=bands.flatMap(b=>shuffle([0,1,2]).map(r=>b*3+r));
 const stacks=shuffle([0,1,2]);
 const cols=stacks.flatMap(b=>shuffle([0,1,2]).map(c=>b*3+c));
 const nums=shuffle([1,2,3,4,5,6,7,8,9]);

 return rows.flatMap(r=>cols.map(c=>nums[pattern(r,c)]));
}

function countSolutions(grid,limit=2){
 let count=0;

 function solve(){
  let best=-1,bestOptions=null;

  for(let i=0;i<81;i++){
   if(grid[i]!==0)continue;
   let options=[];

   for(let n=1;n<=9;n++){
    if(valid(grid,i,n))options.push(n);
   }

   if(options.length===0)return;
   if(best===-1||options.length<bestOptions.length){
    best=i;bestOptions=options;
    if(options.length===1)break;
   }
  }

  if(best===-1){
   count++;
   return;
  }

  for(const n of bestOptions){
   grid[best]=n;
   solve();
   grid[best]=0;
   if(count>=limit)return;
  }
 }

 solve();
 return count;
}

function valid(grid,index,n){
 const row=Math.floor(index/9);
 const col=index%9;

 for(let i=0;i<9;i++){
  if(grid[row*9+i]===n)return false;
  if(grid[i*9+col]===n)return false;
 }

 const br=Math.floor(row/3)*3;
 const bc=Math.floor(col/3)*3;

 for(let r=br;r<br+3;r++)
 for(let c=bc;c<bc+3;c++)
  if(grid[r*9+c]===n)return false;

 return true;
}

function makePuzzle(level){
 solution=generateSolution();
 puzzle=[...solution];

 const target={easy:36,medium:46,hard:53}[level];
 const positions=shuffle(Array.from({length:81},(_,i)=>i));
 let removed=0;

 for(const i of positions){
  if(removed>=target)break;

  const old=puzzle[i];
  puzzle[i]=0;

  if(countSolutions([...puzzle])===1){
   removed++;
  }else{
   puzzle[i]=old;
  }
 }

 fixed=puzzle.map(n=>n!==0);
}

// ====================================
// BOARD RENDERING
// ====================================
function render(){
 boardEl.innerHTML="";

 for(let i=0;i<81;i++){
  const cell=document.createElement("div");
  cell.className="cell";

  const row=Math.floor(i/9),col=i%9;
  const value=puzzle[i];

  if(fixed[i])cell.classList.add("fixed");
  if(selected===i)cell.classList.add("selected");

  if(selected>=0){
   const sr=Math.floor(selected/9),sc=selected%9;
   if(row===sr||col===sc||
    (Math.floor(row/3)===Math.floor(sr/3)&&
     Math.floor(col/3)===Math.floor(sc/3))){
     cell.classList.add("related");
   }
   if(value&&value===puzzle[selected])cell.classList.add("same");
  }

  if(value){
   cell.textContent=value;
  }else if(notes[i].size){
   cell.classList.add("notes");
   for(let n=1;n<=9;n++){
    const span=document.createElement("span");
    span.className="note";
    span.textContent=notes[i].has(n)?n:"";
    cell.appendChild(span);
   }
  }

  cell.addEventListener("click",()=>{
   if(gameOver)return;
   selected=i;
   render();
  });

  boardEl.appendChild(cell);
 }
}

function renderNumbers(){
 numberEl.innerHTML="";
 for(let n=1;n<=9;n++){
  const btn=document.createElement("button");
  btn.className="num";
  btn.textContent=n;

  const remaining=81-puzzle.filter((v,i)=>v===n).length;
  btn.disabled=gameOver||remaining===0;

  btn.addEventListener("click",()=>enterNumber(n));
  numberEl.appendChild(btn);
 }
}

// ====================================
// PLAYER ACTIONS
// ====================================
function saveHistory(){
 history.push({
  puzzle:[...puzzle],
  notes:notes.map(s=>[...s]),
  mistakes
 });
 if(history.length>40)history.shift();
}

function enterNumber(n){
 if(gameOver||selected<0||fixed[selected]){
  message("Select an empty cell first.");
  return;
 }

 if(noteMode){
  saveHistory();
  if(notes[selected].has(n))notes[selected].delete(n);
  else notes[selected].add(n);
  render();
  return;
 }

 if(puzzle[selected]===n)return;

 saveHistory();

 if(n!==solution[selected]){
  mistakes++;
  $("mistakes").textContent=mistakes+" / 3";
  boardEl.children[selected].classList.add("error");
  message("Incorrect number. Try again!");

  if(mistakes>=3)endGame(false);
  return;
 }

 puzzle[selected]=n;
 notes[selected].clear();
 selected=-1;
 render();
 renderNumbers();
 checkWin();
 saveGame();
}

function eraseCell(){
 if(selected<0||fixed[selected]||gameOver)return;
 saveHistory();
 puzzle[selected]=0;
 notes[selected].clear();
 render();
 renderNumbers();
 saveGame();
}

function undo(){
 if(gameOver||!history.length)return;
 const old=history.pop();
 puzzle=old.puzzle;
 notes=old.notes.map(a=>new Set(a));
 mistakes=old.mistakes;
 $("mistakes").textContent=mistakes+" / 3";
 render();
 renderNumbers();
 saveGame();
}

function hint(){
 if(gameOver||hints<=0)return;
 if(selected<0||fixed[selected]){
  message("Select an empty cell to use a hint.");
  return;
 }

 saveHistory();
 puzzle[selected]=solution[selected];
 notes[selected].clear();
 hints--;
 $("hints").textContent=hints;
 selected=-1;
 render();
 renderNumbers();
 checkWin();
 saveGame();
 message("A correct number has been revealed!");
}

function checkPuzzle(){
 if(gameOver)return;
 let wrong=0,empty=0;

 for(let i=0;i<81;i++){
  if(!puzzle[i])empty++;
  else if(puzzle[i]!==solution[i])wrong++;
 }

 if(empty===0&&wrong===0){
  checkWin();
 }else{
  message(empty+" empty cells · "+wrong+" incorrect cells.");
 }
}

function checkWin(){
 if(puzzle.every((n,i)=>n===solution[i])){
  endGame(true);
 }
}

// ====================================
// GAME FLOW
// ====================================
function message(text){
 $("message").textContent=text;
}

function startTimer(){
 clearInterval(timerInterval);
 timerInterval=setInterval(()=>{
  if(gameOver)return;
  elapsed++;
  $("timer").textContent=formatTime(elapsed);
  saveGame();
 },1000);
}

function formatTime(s){
 return String(Math.floor(s/60)).padStart(2,"0")+":"+
 String(s%60).padStart(2,"0");
}

function endGame(win){
 gameOver=true;
 clearInterval(timerInterval);
 $("modalTitle").textContent=win?"Congratulations!":"Game Over";
 $("modalText").textContent=win?
 "Amazing! You solved the Sudoku puzzle in "+formatTime(elapsed)+".":
 "You used all 3 mistakes. Try another puzzle and improve your skills.";
 $("overlay").classList.add("show");
 localStorage.removeItem("sudoku_save");
}

function newGame(){
 if(!gameOver&&puzzle.length&&
  !confirm("Start a new game? Your current progress will be lost."))return;

 difficulty=localStorage.getItem("sudoku_difficulty")||"easy";
 if(!["easy","medium","hard"].includes(difficulty))difficulty="easy";

 $("difficulty").textContent=difficulty.toUpperCase();
 makePuzzle(difficulty);

 notes=Array.from({length:81},()=>new Set());
 selected=-1;
 mistakes=0;hints=3;elapsed=0;
 noteMode=false;gameOver=false;history=[];

 $("mistakes").textContent="0 / 3";
 $("hints").textContent="3";
 $("timer").textContent="00:00";
 $("notesBtn").textContent="✎ Notes: OFF";
 $("notesBtn").classList.remove("active");
 $("overlay").classList.remove("show");

 message("Select a cell and choose a number.");
 render();
 renderNumbers();
 startTimer();
 saveGame();
}

function saveGame(){
 if(!puzzle.length||gameOver)return;
 localStorage.setItem("sudoku_save",JSON.stringify({
  difficulty,solution,puzzle,fixed,
  notes:notes.map(s=>[...s]),
  mistakes,hints,elapsed
 }));
}

function loadGame(){
 try{
  const data=JSON.parse(localStorage.getItem("sudoku_save"));
  if(!data||data.difficulty!==difficulty||
   !Array.isArray(data.puzzle)||data.puzzle.length!==81||
   !Array.isArray(data.solution)||data.solution.length!==81)return false;

  difficulty=data.difficulty;
  solution=data.solution;
  puzzle=data.puzzle;
  fixed=data.fixed;
  notes=data.notes.map(a=>new Set(a));
  mistakes=data.mistakes||0;
  hints=data.hints??3;
  elapsed=data.elapsed||0;
  $("mistakes").textContent=mistakes+" / 3";
  $("hints").textContent=hints;
  $("timer").textContent=formatTime(elapsed);
  $("difficulty").textContent=difficulty.toUpperCase();
  render();
  renderNumbers();
  message("Your previous game has been restored.");
  startTimer();
  return true;
 }catch(e){return false;}
}

// ====================================
// BUTTONS
// ====================================
$("notesBtn").onclick=()=>{
 if(gameOver)return;
 noteMode=!noteMode;
 $("notesBtn").classList.toggle("active",noteMode);
 $("notesBtn").textContent=noteMode?"✎ Notes: ON":"✎ Notes: OFF";
 message(noteMode?"Notes mode enabled.":"Notes mode disabled.");
};

$("eraseBtn").onclick=eraseCell;
$("undoBtn").onclick=undo;
$("hintBtn").onclick=hint;
$("checkBtn").onclick=checkPuzzle;
$("newBtn").onclick=newGame;
$("modalNew").onclick=()=>{
 gameOver=true;
 $("overlay").classList.remove("show");
 newGame();
};
$("modalHome").onclick=()=>location.href="index.html";

document.addEventListener("keydown",e=>{
 if(gameOver)return;
 if(e.key>="1"&&e.key<="9")enterNumber(Number(e.key));
 if(e.key==="Backspace"||e.key==="Delete")eraseCell();
 if(e.key==="ArrowRight"&&selected>=0)selected=Math.min(80,selected+1);
 if(e.key==="ArrowLeft"&&selected>=0)selected=Math.max(0,selected-1);
 if(e.key==="ArrowUp"&&selected>=0)selected=Math.max(0,selected-9);
 if(e.key==="ArrowDown"&&selected>=0)selected=Math.min(80,selected+9);
 render();
});

// ====================================
// INITIALIZE
// ====================================
if(!loadGame())newGame();
</script>

</body>
</html>
